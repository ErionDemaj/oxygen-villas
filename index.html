
<!DOCTYPE html>
<html lang="sq">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Oxygen Villas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

:root {
    --navy: #101e30;
    --panel: #17283d;
    --gold: #dfbb78;
    --green: #c9edcc;
    --red: #f39a9a;
    --yellow: #f9d66d;
}

body {
    margin: 0;
    background: var(--navy);
    color: white;
    font: 15px system-ui, sans-serif;
}

[hidden] {
    display: none !important;
}

button, input, select, textarea {
    font: inherit;
    border-radius: 8px;
    padding: 11px;
    border: 1px solid #cbd5e1;
}

button {
    cursor: pointer;
    border: 0;
}

button:disabled {
    opacity: 0.5;
    cursor: wait;
}

button.gold, .active {
    background: var(--gold) !important;
    color: var(--navy) !important;
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
}

label {
    display: block;
    margin: 12px 0 5px;
    font-weight: 600;
}

/* LOGIN */

#login {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: radial-gradient(
        ellipse at top,
        #29425c,
        #101e30 70%
    );
    padding: 20px;
}

.login-card {
    width: min(380px, 100%);
    padding: 30px;
    background: var(--panel);
    border: 1px solid var(--gold);
    border-radius: 24px;
}

.brand {
    color: var(--gold);
    letter-spacing: 4px;
    margin: 0;
}

.login-card h1,
.login-card p {
    text-align: center;
}

.login-card input {
    background: #20334b;
    color: white;
}

.login-card button {
    width: 100%;
    margin-top: 18px;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 20px;
    flex-wrap: wrap;
}

header small {
    color: #b9c7d8;
}

.header-actions {
    display: flex;
    gap: 7px;
}

main {
    display: flex;
    gap: 14px;
    padding: 0 14px 14px;
}

/* MUAJT */

aside {
    width: 170px;
    flex-shrink: 0;
}

aside button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    color: white;
    margin: 3px 0;
}

aside select {
    background: #20334b;
    color: var(--gold);
}

/* KALENDARI */

section {
    flex: 1;
    min-width: 0;
    background: #f5f7fb;
    color: #172234;
    border-radius: 18px;
    padding: 16px;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

h2 {
    margin: 0;
}

.legend {
    font-size: 12px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
}

.scroll {
    overflow: auto;
    max-height: 75vh;
    margin-top: 12px;
    overscroll-behavior: contain;
    overflow-anchor: none;
    scroll-behavior: auto;
}

#calendar {
    border-spacing: 3px;
    width: 100%;
    min-width: 920px;
    table-layout: fixed;
}

#calendar th {
    background: #172b43;
    color: white;
    position: sticky;
    top: 0;
    z-index: 5;
    height: 42px;
    border-radius: 6px;
    font-size: 13px;
}

#calendar th:first-child,
#calendar td.date {
    width: 72px;
    position: sticky;
    left: 0;
}

#calendar th:first-child {
    z-index: 7;
}

#calendar td {
    height: 43px;
    border-radius: 6px;
    text-align: center;
    font-size: 12px;
    overflow-wrap: anywhere;
    word-break: normal;
    padding: 4px;
}

#calendar td.date {
    background: #dce3ed;
    font-weight: bold;
    z-index: 4;
}

.free {
    background: var(--green);
}

.booked {
    background: var(--red);
    color: #631b24;
}

.pending {
    background: var(--yellow);
    color: #614500;
}

#calendar td:not(.date) {
    cursor: pointer;
    font-weight: bold;
}

#calendar th:not(:first-child) {
    cursor: pointer;
}

#calendar th:not(:first-child):hover {
    background: var(--gold);
    color: var(--navy);
}

.villa-short {
    display: none;
}

.booking-name {
    display: block;
    max-width: 100%;
    overflow-wrap: anywhere;
    white-space: normal;
    line-height: 1.15;
}

/* FORMULARI */

dialog {
    border: 0;
    border-radius: 18px;
    padding: 22px;
    width: min(420px, 94vw);
    max-height: 90dvh;
    overflow: auto;
    color: #172234;
    overscroll-behavior: contain;
}

dialog::backdrop {
    background: #0009;
}

.dates {
    display: grid;
    grid-template-columns: 1fr 1fr 1.4fr;
    gap: 7px;
}

.dates small {
    display: block;
    color: #64748b;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
}

.actions button {
    flex: 1;
}

.danger {
    background: #a92935;
    color: white;
}

.error {
    color: #d34b55;
    white-space: pre-wrap;
}

#nights {
    background: #e7edf4;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
}

#connection {
    font-size: 12px;
    color: #52647a;
    margin: 8px 0;
}

/* TABELA E REZERVIMEVE */

#villaOverview {
    width: min(650px, 94vw);
    background: var(--panel);
    color: white;
    border: 1px solid var(--gold);
    max-height: 85dvh;
}

.overview-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: var(--gold);
}

.overview-head h2 {
    font-size: 20px;
}

.overview-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 16px 0;
}

.overview-stats div {
    background: #20334b;
    padding: 12px;
    border-radius: 10px;
}

.overview-stats strong {
    display: block;
    font-size: 25px;
    color: var(--gold);
}

.overview-scroll {
    overflow: auto;
    overscroll-behavior: contain;
}

#overviewTable {
    width: 100%;
    border-spacing: 3px;
    table-layout: fixed;
}

#overviewTable th {
    background: #293c54;
    color: var(--gold);
    padding: 8px 3px;
    border-radius: 5px;
    font-size: 12px;
}

#overviewTable td {
    background: #20334b;
    color: white;
    padding: 10px 3px;
    text-align: center;
    overflow-wrap: anywhere;
    border-radius: 5px;
    font-size: 12px;
}

#overviewTable td.booked {
    background: #a92935;
}

#overviewTable td.pending {
    background: var(--yellow);
    color: #614500;
}

#overviewFree {
    background: #203c35;
    color: #a6edb5;
    padding: 12px;
    border-radius: 10px;
}

/* TELEFONI - PA SCROLL HORIZONTAL */

@media(max-width: 700px) {

    html, body {
        width: 100%;
        max-width: 100%;
        overscroll-behavior: none;
    }

    body:has(#app:not([hidden])) {
        overflow: hidden;
    }

    #app:not([hidden]) {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    #app header {
        flex-shrink: 0;
        padding: 12px 8px;
        gap: 8px;
    }

    #app header h1 {
        font-size: 19px;
        letter-spacing: 2px;
    }

    #app header small {
        font-size: 10px;
    }

    .header-actions button {
        font-size: 11px;
        padding: 9px;
    }

    #app main {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        gap: 6px;
        padding: 0 4px 4px;
    }

    /* MUAJT NE TELEFON */

    #months {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        flex-shrink: 0;
        gap: 3px;
        padding-bottom: 4px;
    }

    #months select {
        grid-column: 1 / -1;
        width: 100%;
        padding: 5px;
        text-align: center;
    }

    #months button {
        width: 100%;
        text-align: center;
        font-size: 11px;
        padding: 7px 2px;
        margin: 0;
    }

    #app section {
        flex: 1;
        min-height: 0;
        min-width: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 6px 3px;
        border-radius: 12px;
    }

    #app section > :not(.scroll) {
        flex-shrink: 0;
    }

    .toolbar {
        justify-content: center;
        gap: 6px;
    }

    .toolbar h2 {
        width: 100%;
        text-align: center;
        font-size: 18px;
    }

    .legend {
        justify-content: center;
        font-size: 10px;
        gap: 8px;
    }

    .dot {
        width: 9px;
        height: 9px;
    }

    #connection {
        text-align: center;
        font-size: 10px;
        margin: 5px 0;
    }

    #refresh,
    #import {
        padding: 5px;
        font-size: 11px;
        margin-bottom: 3px;
    }

    .scroll {
        flex: 1;
        min-height: 0;
        min-width: 0;
        max-height: none;
        width: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        touch-action: pan-y;
        overscroll-behavior: contain;
        margin-top: 4px;
    }

    /* TE 8 VILLAT NE NJE EKRAN */

    #calendar {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        table-layout: fixed;
        border-spacing: 1px 2px;
    }

    #calendar th:first-child,
    #calendar td.date {
        width: 36px;
        font-size: 10px;
    }

    #calendar th {
        font-size: 11px;
        height: 33px;
        padding: 1px;
        border-radius: 4px;
    }

    #calendar td {
        height: 40px;
        font-size: 9px;
        padding: 2px 1px;
        border-radius: 4px;
        overflow-wrap: anywhere;
        word-break: normal;
    }

    .villa-full {
        display: none;
    }

    .villa-short {
        display: inline;
    }

    .booking-name {
        font-size: 9px;
        font-weight: 700;
        line-height: 1.15;
        overflow-wrap: anywhere;
        white-space: normal;
    }

    input, select, textarea {
        font-size: 16px;
    }

    #villaOverview {
        padding: 12px;
    }

    .overview-head h2 {
        font-size: 17px;
    }

    #overviewTable th,
    #overviewTable td {
        font-size: 10px;
        padding: 8px 2px;
    }

}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="login">

    <form id="loginForm" class="login-card">

        <h1 class="brand">OXYGEN</h1>

        <p style="letter-spacing:7px">
            VILLAS
        </p>

        <p>Reservation Management</p>

        <label for="username">
            Emri i përdoruesit
        </label>

        <input
            id="username"
            autocomplete="username"
            required
        >

        <label for="password">
            Fjalëkalimi
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <button class="gold">
            KYÇU
        </button>

        <p id="loginError"
           class="error"
           role="alert"></p>

    </form>

</div>

<!-- APLIKACIONI -->

<div id="app" hidden>

<header>

    <div>

        <h1 class="brand">
            OXYGEN VILLAS
        </h1>

        <small>
            Menaxhimi i rezervimeve
        </small>

    </div>

    <div class="header-actions">

        <button id="new" class="gold">
            + Rezervim i ri
        </button>

        <button id="logout">
            Dil
        </button>

    </div>

</header>

<main>

    <aside id="months">

        <select id="year"></select>

    </aside>

    <section>

        <div class="toolbar">

            <h2 id="title"></h2>

            <div class="legend">

                <span>
                    <i class="dot free"></i>
                    E lirë
                </span>

                <span>
                    <i class="dot booked"></i>
                    E rezervuar
                </span>

                <span>
                    <i class="dot pending"></i>
                    Në pritje
                </span>

            </div>

        </div>

        <p id="connection" role="status"></p>

        <button id="refresh">
            Rifresko
        </button>

        <button id="import" hidden>
            Transfero rezervimet lokale
        </button>

        <div class="scroll">

            <table id="calendar"></table>

        </div>

    </section>

</main>

</div>

<!-- FORMULARI -->

<dialog id="modal">

    <form id="form">

        <h2 id="formTitle"></h2>

        <label>Villa</label>

        <select id="villa"></select>

        <label>Emri i familjes</label>

        <input
            id="name"
            required
            maxlength="100"
        >

        <label>Numri i telefonit</label>

        <input id="phone" type="tel">

        <label>Data e ardhjes</label>

        <div class="dates" id="arrival"></div>

        <label>Data e largimit</label>

        <div class="dates" id="departure"></div>

        <p id="nights"></p>

        <label>Statusi</label>

        <select id="status">

            <option value="booked">
                E rezervuar
            </option>

            <option value="pending">
                Në pritje
            </option>

        </select>

        <label>Shënime</label>

        <textarea id="notes" rows="3"></textarea>

        <p id="error"
           class="error"
           role="alert"></p>

        <div class="actions">

            <button class="gold" id="save">
                Ruaj
            </button>

            <button type="button" id="cancel">
                Anulo
            </button>

            <button
                type="button"
                id="remove"
                class="danger">
                Fshi
            </button>

        </div>

    </form>

</dialog>

<!-- TABELA E REZERVIMEVE SIPAS VILLES -->

<dialog id="villaOverview">

    <div class="overview-head">

        <h2 id="overviewTitle"></h2>

        <button
            id="overviewClose"
            type="button"
            aria-label="Mbyll">
            ✕
        </button>

    </div>

    <div class="overview-stats">

        <div>

            Rezervime

            <strong id="overviewCount">
                0
            </strong>

        </div>

        <div>

            Net të zëna

            <strong id="overviewNights">
                0
            </strong>

        </div>

    </div>

    <p id="overviewEmpty" hidden>
        Nuk ka rezervime për këtë muaj.
    </p>

    <div class="overview-scroll">

        <table id="overviewTable">

            <thead>

                <tr>

                    <th>Familja</th>
                    <th>Ardhja</th>
                    <th>Largimi</th>
                    <th>Net</th>
                    <th>Statusi</th>

                </tr>

            </thead>

            <tbody id="overviewBody"></tbody>

        </table>

    </div>

    <p id="overviewFree"></p>

</dialog>

<script>

/* LIDHJA ME SUPABASE */

const $ = id => document.getElementById(id);

const db = supabase.createClient(

    "https://tjeggmejvmngcwvogsze.supabase.co",

    "sb_publishable_MEyDxpARTqqCcc_8-UrKDw_gjnKwJl2"

);

const email = "e.demaj10@gmail.com";

/* KONFIGURIMI */

const names = [

    "Janar",
    "Shkurt",
    "Mars",
    "Prill",
    "Maj",
    "Qershor",
    "Korrik",
    "Gusht",
    "Shtator",
    "Tetor",
    "Nëntor",
    "Dhjetor"

];

const now = new Date();

const pad = n => String(n).padStart(2, "0");

const iso = (y, m, d) =>
    `${y}-${pad(m + 1)}-${pad(d)}`;

const next = s =>
    new Date(Date.parse(s) + 86400000)
        .toISOString().slice(0, 10);

let year = now.getFullYear();
let month = now.getMonth();

let bookings = [];
let editing = null;
let channel = null;
let ready = false;
let version = 0;
let busy = false;
let overviewVilla = 1;

const last = Math.max(2040, year + 5);

/* VITET */

for (let y = 2026; y <= last; y++) {

    $("year").add(new Option(y, y));

}

$("year").value = year;

/* 8 VILLAT */

for (let v = 1; v <= 8; v++) {

    $("villa").add(
        new Option("Villa " + v, v)
    );

}

/* MUAJT */

names.forEach((n, i) => {

    let b = document.createElement("button");

    b.textContent = n;

    b.onclick = () => {

        month = i;

        render();

        document.querySelector(".scroll")
            .scrollTop = 0;

    };

    $("months").append(b);

});

$("year").onchange = () => {

    year = +$("year").value;

    render();

    document.querySelector(".scroll")
        .scrollTop = 0;

};

/* DATAT DITA MUAJI VITI */

for (const p of ["arrival", "departure"]) {

    for (const [k, label] of [

        ["Day", "Dita"],
        ["Month", "Muaji"],
        ["Year", "Viti"]

    ]) {

        let div = document.createElement("div");

        let s = document.createElement("select");

        let l = document.createElement("small");

        l.textContent = label;

        s.id = p + k;

        s.setAttribute(
            "aria-label",
            p + " " + label
        );

        div.append(l, s);

        $(p).append(div);

        if (k === "Month") {

            for (let i = 1; i <= 12; i++) {

                s.add(new Option(pad(i), i));

            }

        }

        if (k === "Year") {

            for (let i = 2026; i <= last + 1; i++) {

                s.add(new Option(i, i));

            }

        }

        s.onchange = () => {

            if (k !== "Day") days(p);

            count();

        };

    }

}

function days(p, d) {

    let s = $(p + "Day");

    let old = d || +s.value || 1;

    let max = new Date(

        +$(p + "Year").value,

        +$(p + "Month").value,

        0

    ).getDate();

    s.replaceChildren();

    for (let i = 1; i <= max; i++) {

        s.add(new Option(pad(i), i));

    }

    s.value = Math.min(old, max);

}

function setDate(p, s) {

    let [y, m, d] = s.split("-").map(Number);

    $(p + "Year").value = y;

    $(p + "Month").value = m;

    days(p, d);

}

function getDate(p) {

    return iso(

        +$(p + "Year").value,

        +$(p + "Month").value - 1,

        +$(p + "Day").value

    );

}

function count() {

    let n = (

        Date.parse(getDate("departure")) -

        Date.parse(getDate("arrival"))

    ) / 86400000;

    $("nights").textContent = n > 0

        ? "Gjithsej: " + n +
          (n === 1 ? " natë" : " net")

        : "Kontrollo datat";

}

/* KALENDARI */

function render() {

    $("title").textContent =
        names[month] + " " + year;

    document.querySelectorAll("aside button")

        .forEach((b, i) =>

            b.classList.toggle("active", i === month)

        );

    const scroll = document.querySelector(".scroll");

    const oldTop = scroll.scrollTop;

    const oldLeft = scroll.scrollLeft;

    let t = $("calendar");

    t.replaceChildren();

    if (!ready) return;

    let h = t.createTHead().insertRow();

    let dateHeader = document.createElement("th");

    dateHeader.textContent = "Data";

    h.append(dateHeader);

    /* TITULLI I VILLAVE */

    for (let v = 1; v <= 8; v++) {

        let th = document.createElement("th");

        let full = document.createElement("span");

        full.className = "villa-full";

        full.textContent = "Villa " + v;

        let short = document.createElement("span");

        short.className = "villa-short";

        short.textContent = "V" + v;

        th.append(full, short);

        th.dataset.villa = v;

        th.tabIndex = 0;

        th.setAttribute("role", "button");

        th.setAttribute(
            "aria-label",
            "Villa " + v + " - Rezervimet"
        );

        th.onclick = () => {

            openVillaOverview(v);

        };

        th.onkeydown = e => {

            if (

                e.key === "Enter" ||

                e.key === " "

            ) {

                e.preventDefault();

                openVillaOverview(v);

            }

        };

        h.append(th);

    }

    let body = t.createTBody();

    let max = new Date(

        year,

        month + 1,

        0

    ).getDate();

    for (let d = 1; d <= max; d++) {

        let row = body.insertRow();

        let date = iso(year, month, d);

        let c = row.insertCell();

        c.className = "date";

        c.textContent =
            pad(d) + "." + pad(month + 1);

        for (let v = 1; v <= 8; v++) {

            let b = bookings.find(x =>

                Number(x.villa) === v &&

                x.arrival <= date &&

                date < x.departure

            );

            if (

                b &&

                d > 1 &&

                b.arrival < date

            ) {

                continue;

            }

            let cell = row.insertCell();

            cell.className = b

                ? b.status

                : "free";

            if (b) {

                let span = 1;

                while (

                    d + span <= max &&

                    iso(year, month, d + span)
                        < b.departure

                ) {

                    span++;

                }

                cell.rowSpan = span;

                let family = document.createElement("span");

                family.className = "booking-name";

                family.textContent = b.name;

                cell.append(family);

                cell.title = b.name;

            }

            cell.onclick = () =>

                openForm(v, date, b);

        }

    }

    scroll.scrollTop = oldTop;

    scroll.scrollLeft = oldLeft;

}

/* LEXIMI NGA SUPABASE */

async function load() {

    let token = ++version;

    try {

        let all = [];

        let offset = 0;

        while (true) {

            let {data, error} = await db

                .from("bookings")

                .select("*")

                .order("id")

                .range(offset, offset + 999);

            if (error) throw error;

            all.push(...data);

            if (data.length < 1000) break;

            offset += 1000;

        }

        if (

            token !== version ||

            $("app").hidden

        ) return;

        const changed =

            !ready ||

            JSON.stringify(bookings) !==
            JSON.stringify(all);

        bookings = all;

        ready = true;

        $("connection").textContent =

            "Online • " +

            bookings.length +

            " rezervime";

        if (changed) {

            render();

            if ($("villaOverview").open) {

                updateOverview();

            }

        }

    } catch (e) {

        if (token !== version) return;

        ready = false;

        render();

        if ($("villaOverview").open) {

            $("villaOverview").close();

        }

        $("connection").textContent =

            "Gabim në lidhje: " + e.message;

    }

}

/* REZERVIMET LOKALE */

function local() {

    try {

        let a = JSON.parse(

            localStorage.getItem(

                "villa-bookings-v1"

            ) || "[]"

        );

        return Array.isArray(a) ? a : [];

    } catch {

        return [];

    }

}

/* HAPJA E APLIKACIONIT */

async function show() {

    if (!$("app").hidden) return;

    $("login").hidden = true;

    $("app").hidden = false;

    $("password").value = "";

    $("import").hidden = !local().length;

    $("connection").textContent =

        "Duke u lidhur...";

    await load();

    if ($("app").hidden) return;

    channel = db

        .channel("oxygen-bookings")

        .on(

            "postgres_changes",

            {

                event: "*",

                schema: "public",

                table: "bookings"

            },

            () => load()

        )

        .subscribe(s => {

            if (s === "SUBSCRIBED") load();

        });

}

/* MBYLLJA E APLIKACIONIT */

function hide() {

    version++;

    ready = false;

    bookings = [];

    render();

    $("app").hidden = true;

    $("login").hidden = false;

    if (channel) {

        db.removeChannel(channel);

        channel = null;

    }

    if ($("modal").open) {

        $("modal").close();

    }

    if ($("villaOverview").open) {

        $("villaOverview").close();

    }

}

/* LOGIN */

$("loginForm").onsubmit = async e => {

    e.preventDefault();

    let btn = e.target.querySelector("button");

    btn.disabled = true;

    $("loginError").textContent = "";

    try {

        if (

            $("username").value.trim()
                .toLowerCase() !== "oxygen"

        ) {

            throw Error(

                "Username ose fjalëkalimi i gabuar."

            );

        }

        let {error} = await db.auth.signInWithPassword({

            email: email,

            password: $("password").value

        });

        if (error) throw error;

        await show();

    } catch (e) {

        $("loginError").textContent = e.message;

    } finally {

        btn.disabled = false;

    }

};

/* LOGOUT */

$("logout").onclick = async () => {

    let {error} = await db.auth.signOut();

    if (error) {

        alert(error.message);

        return;

    }

    hide();

};

/* SESIONI */

db.auth.onAuthStateChange((event, session) => {

    if (!session) {

        hide();

    } else {

        setTimeout(show, 0);

    }

});

/* SINKRONIZIMI */

$("refresh").onclick = load;

window.addEventListener("focus", () => {

    if (!$("app").hidden) load();

});

setInterval(() => {

    if (

        !$("app").hidden &&

        !document.hidden

    ) {

        load();

    }

}, 30000);

/* FORMULARI */

function openForm(v, date, b) {

    if (!ready) return;

    editing = b?.id || null;

    $("formTitle").textContent = b

        ? "Ndrysho rezervimin"

        : "Rezervim i ri";

    $("villa").value = v;

    for (let k of ["name", "phone", "notes"]) {

        $(k).value = b?.[k] || "";

    }

    $("status").value = b?.status || "booked";

    setDate(

        "arrival",

        b?.arrival || date

    );

    setDate(

        "departure",

        b?.departure || next(date)

    );

    $("remove").hidden = !b;

    $("error").textContent = "";

    count();

    $("modal").showModal();

}

/* REZERVIM I RI */

$("new").onclick = () => {

    openForm(

        1,

        iso(

            year,

            month,

            year === now.getFullYear() &&

            month === now.getMonth()

                ? now.getDate()

                : 1

        )

    );

};

$("cancel").onclick = () => {

    if (!busy) $("modal").close();

};

$("modal").addEventListener("cancel", e => {

    if (busy) e.preventDefault();

});

function lock(v) {

    busy = v;

    for (let k of ["save", "remove", "cancel"]) {

        $(k).disabled = v;

    }

}

function msg(e) {

    return e.code === "23P01"

        ? "Kjo villë është e zënë në këto data!"

        : e.message;

}

/* RUAJTJA E REZERVIMIT */

$("form").onsubmit = async e => {

    e.preventDefault();

    if (busy) return;

    if (!ready) {

        $("error").textContent =

            "Nuk ka lidhje me databazën.";

        return;

    }

    let b = {

        villa: +$("villa").value,

        name: $("name").value.trim(),

        phone: $("phone").value.trim(),

        arrival: getDate("arrival"),

        departure: getDate("departure"),

        status: $("status").value,

        notes: $("notes").value.trim()

    };

    if (!b.name || b.departure <= b.arrival) {

        $("error").textContent =

            "Kontrollo emrin dhe datat.";

        return;

    }

    /* KONTROLLI I REZERVIMEVE TE DYFISHTA */

    const conflict = bookings.some(x =>

        x.id !== editing &&

        Number(x.villa) === b.villa &&

        x.arrival < b.departure &&

        x.departure > b.arrival

    );

    if (conflict) {

        $("error").textContent =

            "Kjo villë është e zënë në këto data!";

        return;

    }

    lock(true);

    try {

        let q = editing

            ? db.from("bookings")

                .update(b)

                .eq("id", editing)

            : db.from("bookings")

                .insert(b);

        let {error} = await q

            .select("id")

            .single();

        if (error) throw error;

        $("modal").close();

        await load();

    } catch (e) {

        $("error").textContent = msg(e);

    } finally {

        lock(false);

    }

};

/* FSHIRJA E REZERVIMIT */

$("remove").onclick = async () => {

    if (

        busy ||

        !editing ||

        !confirm("A dëshiron ta fshish rezervimin?")

    ) return;

    lock(true);

    try {

        let {error} = await db

            .from("bookings")

            .delete()

            .eq("id", editing)

            .select("id")

            .single();

        if (error) throw error;

        $("modal").close();

        await load();

    } catch (e) {

        $("error").textContent = msg(e);

    } finally {

        lock(false);

    }

};

/* TRANSFERIMI I REZERVIMEVE LOKALE */

$("import").onclick = async () => {

    if (

        !ready ||

        !confirm(

            "Transfero rezervimet nga ky shfletues? " +

            "Rezervimet lokale nuk do të fshihen."

        )

    ) return;

    $("import").disabled = true;

    let added = 0;

    let skipped = 0;

    let errors = [];

    try {

        await load();

        if (!ready) {

            throw Error(

                "Nuk ka lidhje me databazën"

            );

        }

        for (let x of local()) {

            let b = {

                villa: Number(x.villa),

                name: x.name,

                phone: x.phone || "",

                arrival: x.arrival,

                departure: x.departure,

                status: x.status,

                notes: x.notes || ""

            };

            if (

                bookings.some(y =>

                    Object.keys(b).every(k =>

                        (y[k] ?? "") === b[k]

                    )

                )

            ) {

                skipped++;

                continue;

            }

            let {data, error} = await db

                .from("bookings")

                .insert(b)

                .select()

                .single();

            if (error) {

                errors.push(

                    (b.name || "?") +

                    ": " +

                    msg(error)

                );

            } else {

                added++;

                bookings.push(data);

            }

        }

        await load();

        if (ready) render();

        alert(

            "Transferuar: " + added +

            "\nEkzistuese: " + skipped +

            "\nGabime: " + errors.length +

            "\n" + errors.join("\n")

        );

    } catch (e) {

        alert(e.message);

    } finally {

        $("import").disabled = false;

    }

};

/* FORMATIMI I DATAVE */

const formatDate = s =>

    s.split("-").reverse().join(".");

const nightsBetween = (a, b) =>

    (Date.parse(b) - Date.parse(a)) / 86400000;

/* TABELA E REZERVIMEVE */

function updateOverview() {

    const start = iso(

        year,

        month,

        1

    );

    const total = new Date(

        year,

        month + 1,

        0

    ).getDate();

    const end = next(

        iso(year, month, total)

    );

    const list = bookings

        .filter(b =>

            Number(b.villa) === overviewVilla &&

            b.arrival < end &&

            b.departure > start

        )

        .sort((a, b) =>

            a.arrival.localeCompare(b.arrival)

        );

    $("overviewTitle").textContent =

        "Villa " + overviewVilla +

        " – " + names[month] +

        " " + year;

    $("overviewCount").textContent =

        list.length;

    $("overviewBody").replaceChildren();

    let occupied = 0;

    for (const b of list) {

        occupied += nightsBetween(

            b.arrival > start

                ? b.arrival

                : start,

            b.departure < end

                ? b.departure

                : end

        );

        const row = $("overviewBody").insertRow();

        [

            b.name,

            formatDate(b.arrival),

            formatDate(b.departure),

            nightsBetween(

                b.arrival,

                b.departure

            ),

            b.status === "pending"

                ? "Në pritje"

                : "Rezervuar"

        ].forEach((v, i) => {

            const c = row.insertCell();

            c.textContent = v;

            if (i === 4) {

                c.className = b.status;

            }

        });

        /* KLIKIMI MBI REZERVIMIN NE TABELE */

        row.style.cursor = "pointer";

        row.onclick = () => {

            $("villaOverview").close();

            openForm(

                Number(b.villa),

                b.arrival,

                b

            );

        };

    }

    $("overviewNights").textContent = occupied;

    $("overviewFree").textContent =

        (total - occupied) +

        " net të lira këtë muaj";

    $("overviewEmpty").hidden =

        !!list.length;

    $("overviewTable").hidden =

        !list.length;

}

/* HAPJA E TABELES */

function openVillaOverview(v) {

    if (!ready) return;

    overviewVilla = v;

    updateOverview();

    if (!$("villaOverview").open) {

        $("villaOverview").showModal();

    }

}

/* MBYLLJA E TABELES */

$("overviewClose").onclick = () =>

    $("villaOverview").close();

</script>

</body>
